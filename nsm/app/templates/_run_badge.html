{# 실행 결과 배지(실행 기록·오늘 화면 공용, C11) #}
{% macro run_badge(ok, message='') %}{% if ok %}<span class="badge ok">성공</span>{% elif ok is none %}<span class="badge gray">실행 중</span>{% elif message and message.startswith('중단(') %}<span class="badge gray" title="프로그램을 끄는 순간 돌던 작업이라 끊겼습니다. 다음 실행에 다시 합니다">중단</span>{% else %}<span class="badge bad">실패</span>{% endif %}{% endmacro %}
