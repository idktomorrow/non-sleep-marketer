{% extends "base.html" %}
{% block content %}
<h1>주간 리포트</h1>
{% if not names %}<p class="muted">아직 리포트가 없습니다. 매주 월요일 오전 8시에 만들어지며, 개요의 지금 실행에서 weekly_report로 바로 만들 수 있습니다.</p>{% endif %}
<p>{% for n in names %}<a href="/reports?name={{ n }}">{{ n[7:17] }}</a>{% if not loop.last %} · {% endif %}{% endfor %}</p>
{% if body %}<pre>{{ body }}</pre>{% endif %}
{% endblock %}
