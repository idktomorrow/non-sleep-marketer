{% extends "base.html" %}
{% block content %}
<h1>실행 로그</h1>
<table><tr><th>잡</th><th>시작</th><th>끝</th><th>결과</th><th>요약</th></tr>
{% for r in runs %}<tr><td>{{ r.job }}</td><td>{{ r.started_at|kst }}</td><td>{{ r.finished_at|kst }}</td>
<td class="{{ 'ok' if r.ok else 'bad' }}">{{ '성공' if r.ok else ('실행 중' if r.ok is none else '실패') }}</td><td><pre>{{ r.message or '' }}</pre></td></tr>{% endfor %}
</table>
{% endblock %}
