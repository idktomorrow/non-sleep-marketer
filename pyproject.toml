[project]
name = "non-sleep-marketer"
version = "0.4.16"
description = "로컬 단일 프로세스 AI 가상 인플루언서 마케터"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "duckdb>=1.1",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "playwright>=1.47",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "python-ulid>=2.7",
    "pypdf>=5.0",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "pillow>=11",
]

[project.scripts]
nsm = "nsm.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nsm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not contract' -q"
markers = [
    "contract: 실계정 어댑터 계약 테스트 (느림, 테스트 계정 필요). `uv run pytest -m contract`로만 실행",
]
